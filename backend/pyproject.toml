[project]
name = "puppies-backend"
version = "0.1.0"
description = "API HTTP (FastAPI) que expõe o resolvedor/gerador de Puppies (Queens) escrito em Prolog"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
]

[project.optional-dependencies]
janus = ["janus-swi>=1.5"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
